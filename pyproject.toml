[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-tracker"
version = "0.1.0"
description = "Sports fixtures and observed change tracking with SQL Server or PostgreSQL."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "psycopg[binary,pool]>=3.2,<4",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
sqlserver = [
    "pyodbc==5.3.0",
]
cloud = [
    "boto3>=1.35,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sports_tracker = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra"]
markers = [
    "neon: opt-in integration tests that require an isolated Neon target",
    "sqlserver: opt-in integration tests that require an isolated SQL Server database",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
