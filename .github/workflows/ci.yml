name: Offline quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Run Ruff lint
        run: ruff check .

      - name: Verify Ruff formatting
        run: ruff format --check .

      - name: Run offline tests
        run: python -m pytest -q -m "not sqlserver and not neon"
