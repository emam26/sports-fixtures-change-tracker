name: Synchronize OpenLigaDB and deploy Pages

on:
  workflow_dispatch:
    inputs:
      activate:
        description: "Confirm that PostgreSQL archive migration and database prerequisites were verified"
        required: true
        type: boolean
        default: false
  schedule:
    # 02:17 UTC is 08:17 Asia/Dhaka year-round.
    - cron: "17 2 * * *"

concurrency:
  group: sports-fixtures-openligadb-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  synchronize:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      ((github.event_name == 'workflow_dispatch' && inputs.activate == true) ||
      (github.event_name == 'schedule' && vars.ENABLE_SYNC == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install .
      - name: Synchronize, reconcile and export the public dashboard
        env:
          DATABASE_BACKEND: postgresql
          POSTGRES_DATABASE_URL: ${{ secrets.POSTGRES_SYNC_DATABASE_URL }}
          POSTGRES_SSLMODE: verify-full
          PGSSLROOTCERT: /etc/ssl/certs/ca-certificates.crt
          POSTGRES_CHANNEL_BINDING: require
          POSTGRES_CONNECT_TIMEOUT_SECONDS: "10"
          POSTGRES_STATEMENT_TIMEOUT_MS: "30000"
          POSTGRES_POOL_MIN_SIZE: "0"
          POSTGRES_POOL_MAX_SIZE: "2"
          POSTGRES_SCHEMA: public
          OPENLIGADB_BASE_URL: https://api.openligadb.de
          OPENLIGADB_SHORTCUT: ucl
          OPENLIGADB_SEASON: "2026"
          OPENLIGADB_EXPECTED_LEAGUE_ID: "4946"
          OPENLIGADB_TIMEOUT_SECONDS: "10"
          OPENLIGADB_LEAGUE_PHASE_MATCHDAYS: 1,2,3,4,5,6,7,8
          OPENLIGADB_MATCHDAYS: 1,2,3,4,5,6,7,8
          OPENLIGADB_MAX_RETRIES: "3"
          OPENLIGADB_BACKOFF_INITIAL_SECONDS: "1"
          OPENLIGADB_BACKOFF_MAX_SECONDS: "8"
          RAW_SNAPSHOT_DIRECTORY: /tmp/sports-tracker/raw
          # The workflow must not treat an ephemeral runner filesystem as durable.
          RAW_SNAPSHOT_STORAGE: postgresql
        run: python scripts/sync_openligadb.py --pages-output "${RUNNER_TEMP}/sports-tracker-pages"
      - name: Upload the public Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/sports-tracker-pages

  deploy:
    needs: synchronize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated dashboard
        id: deployment
        uses: actions/deploy-pages@v4
